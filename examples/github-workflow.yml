# .github/workflows/toollint.yml in your repository
name: toollint
on: [push, pull_request]
permissions:
  contents: read
  security-events: write   # needed to upload SARIF to code scanning
jobs:
  toollint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install toollint==0.1.0
      - name: Lint MCP configs and tool definitions
        run: toollint scan . --format sarif --output toollint.sarif --exit-zero
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: toollint.sarif
          category: toollint
      - name: Fail on high-severity findings
        run: toollint scan . --fail-on high --format github
