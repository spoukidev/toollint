[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "toollint"
dynamic = ["version"]
description = "Offline security linter for MCP server configs and LLM agent tool definitions: tool poisoning, hidden instructions, overbroad permissions, supply chain and leaked secrets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ToolLint contributors" }]
keywords = ["mcp", "model-context-protocol", "llm", "security", "linter", "prompt-injection", "tool-poisoning", "sarif", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "json5>=0.9.14",
  "PyYAML>=6.0",
  "rapidfuzz>=3.6",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
online = ["httpx>=0.27"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "jsonschema>=4.21",
  "httpx>=0.27",
  "ruff>=0.17.4",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
toollint = "toollint.cli:main"

[tool.hatch.version]
path = "src/toollint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/toollint"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "fixtures", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["toollint"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT"]
ignore = ["E501", "B008", "UP007", "SIM108", "RUF005"]

[tool.ruff.lint.per-file-ignores]
# These files deliberately contain look-alike and invisible characters.
"src/toollint/normalize.py" = ["RUF001", "RUF002", "RUF003"]
"src/toollint/rules/hidden_instructions.py" = ["RUF001", "RUF002"]
"tests/**" = ["RUF001", "RUF003", "PT018"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/toollint"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["json5", "rapidfuzz.*"]
ignore_missing_imports = true
