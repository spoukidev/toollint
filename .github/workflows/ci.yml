name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python scripts/gen_docs.py --check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing
        env:
          # Snapshots and terminal reports use Unicode; force UTF-8 on Windows runners.
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8

  self-scan:
    # Run ToolLint on its own fixtures. The malicious SARIF is kept as an artifact
    # (not uploaded to code scanning, so the repo doesn't fill with intentional alerts).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Clean fixtures must pass
        run: toollint scan fixtures/clean --isolated
      - name: Malicious fixtures must be caught
        run: |
          set +e
          toollint scan fixtures/malicious --isolated --format github
          test $? -eq 1
      - name: SARIF report
        run: toollint scan fixtures/malicious --isolated --format sarif --output toollint.sarif --exit-zero
      - uses: actions/upload-artifact@v7
        with:
          name: toollint-fixtures-sarif
          path: toollint.sarif
